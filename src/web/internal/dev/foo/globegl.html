<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Globe.gl Test</title>
  <style>
    body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
    #globeViz { width:100%; height:100%; }
  </style>
</head>
<body>
<div id="globeViz"></div>

<!-- Three.js and Globe.gl -->
<script src="https://unpkg.com/three@0.153.0/build/three.min.js"></script>
<script src="https://unpkg.com/globe.gl"></script>

<script>
  const Globe = GlobeGL()
    .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
    .pointOfView({ altitude: 2 }, 0)
    .showGlobe(true);

  const globe = Globe(document.getElementById('globeViz'))
    .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
    .pointsData(generateRandomPoints(50))
    .pointLat('lat')
    .pointLng('lng')
    .pointColor(() => 'red')
    .pointRadius(0.5);

  function generateRandomPoints(n) {
    return Array.from({ length: n }, () => ({
      lat: (Math.random() * 180) - 90,
      lng: (Math.random() * 360) - 180
    }));
  }

  // Optional: add marker on click
  globe.onGlobeClick(({ lat, lng }) => {
    globe.pointsData([...globe.pointsData(), { lat, lng }]);
  });
</script>
</body>
</html>

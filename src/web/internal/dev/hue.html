<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <script type="module">
        import { COLORS, getColorAtRatioFromSet, getColorAtRatioScientific, getColorAtRatioScientificTrimmed, getColorAtStep } from '/assets/js/color.js';

        const strata = COLORS.length * 4;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');



        const params = new URLSearchParams(window.location.search);
        let n = params.get('n') !== null ? parseInt(params.get('n')) : COLORS.length * 2;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            draw();
        }

        function draw() {
            const isHorizontal = canvas.width >= canvas.height;
            const flowSize = isHorizontal ? canvas.width : canvas.height;
            const boundSize = isHorizontal ? canvas.height : canvas.width;


            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const blockCount = n !== null ? n : STRATA;
            const blockSize = flowSize / blockCount;

            const strips = [
                { type: 'static', colors: COLORS },
                { type: 'continuous', fn: getColorAtRatioFromSet },
                { type: 'banded', fn: getColorAtRatioFromSet },
                { type: 'separator', label: 'Arbitrary Color Set' },
                
                { type: 'banded', fn: getColorAtRatioScientific },
                { type: 'continuous', fn: getColorAtRatioScientific },
                { type: 'separator', label: 'Visible Spectrum' },

                { type: 'banded', fn: getColorAtRatioScientificTrimmed },
                { type: 'continuous', fn: getColorAtRatioScientificTrimmed },
                { type: 'separator', label: 'Trimmed Visible Spectrum' },
            ];

            const stripSize = boundSize / strips.length;
            let currentPos = 0;
            strips.forEach((strip, index) => {
                const startPos = Math.round(index * stripSize);
                const endPos = Math.round((index + 1) * stripSize);
                const currentSize = endPos - startPos;



                if (strip.type === 'continuous') {
                    for (let step = 0; step < flowSize; step++) {
                        const ratio = 1 - (step / flowSize);
                        ctx.fillStyle = strip.fn(ratio);
                        if (isHorizontal) {
                            ctx.fillRect(step, startPos, 1, stripSize);
                        } else {
                            ctx.fillRect(startPos, flowSize - step - 1, stripSize, 1);
                        }
                    }
                } else if (strip.type === 'banded') {
                    for (let i = 0; i < blockCount; i++) {
                        const ratio = blockCount > 1 ? 1 - (i / (blockCount - 1)) : 0;
                        ctx.fillStyle = getColorAtStep(i, blockCount, strip.fn);
                        if (isHorizontal) {
                            const pos1 = Math.round(i * blockSize);
                            const pos2 = Math.round((i + 1) * blockSize);
                            ctx.fillRect(pos1, startPos, pos2 - pos1, stripSize);
                        } else {
                            const pos1 = flowSize - Math.round((i + 1) * blockSize);
                            const pos2 = flowSize - Math.round(i * blockSize);
                            ctx.fillRect(startPos, pos1, stripSize, pos2 - pos1);
                        }
                    }
                } else if (strip.type === 'static') {
                    const staticCount = strip.colors.length;
                    const staticSize = flowSize / staticCount;
                    for (let i = 0; i < staticCount; i++) {
                        const ratio = staticCount > 1 ? 1 - (i / (staticCount - 1)) : 0;
                        const indexColor = Math.round(ratio * (staticCount - 1));
                        ctx.fillStyle = strip.colors[indexColor];
                        if (isHorizontal) {
                            const pos1 = Math.round(i * staticSize);
                            const pos2 = Math.round((i + 1) * staticSize);
                            ctx.fillRect(pos1, startPos, pos2 - pos1, stripSize);
                        } else {
                            const pos1 = flowSize - Math.round((i + 1) * staticSize);
                            const pos2 = flowSize - Math.round(i * staticSize);
                            ctx.fillRect(startPos, pos1, stripSize, pos2 - pos1);
                        }
                    }
                } else if (strip.type === 'separator') {
                    ctx.fillStyle = '#fff';
                    if (isHorizontal) {
                        ctx.fillRect(0, startPos, flowSize, currentSize);
                    } else {
                        ctx.fillRect(startPos, 0, currentSize, flowSize);
                    }

                    if (strip.label) {
                        ctx.fillStyle = '#f0f0f0';
                        const fontSize = Math.max(10, Math.floor(currentSize * 0.65));
                        ctx.font = `bold ${fontSize}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';

                        if (isHorizontal) {
                            ctx.fillText(strip.label, flowSize / 2, startPos + currentSize / 2);
                        } else {
                            ctx.save();
                            ctx.translate(startPos + currentSize / 2, flowSize / 2);
                            ctx.rotate(Math.PI / 2);
                            ctx.fillText(strip.label, 0, 0);
                            ctx.restore();
                        }
                    }
                }

                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.font = '10px monospace';
                if (isHorizontal) {
                    ctx.fillText(strip.label, 10, startPos + 14);
                } else {
                    ctx.save();
                    ctx.translate(startPos + 14, 10);
                    ctx.rotate(Math.PI / 2);
                    ctx.fillText(strip.label, 0, 0);
                    ctx.restore();
                }
            });

            // ctx.strokeStyle = 'rgba(255, 255, 255, 1)';
            // ctx.lineWidth = 1;
            // [3, 5].forEach(idx => {
            //     const pos = idx * stripSize;
            //     ctx.beginPath();
            //     if (isHorizontal) {
            //         ctx.moveTo(0, pos);
            //         ctx.lineTo(canvas.width, pos);
            //     } else {
            //         ctx.moveTo(pos, 0);
            //         ctx.lineTo(pos, canvas.height);
            //     }
            //     ctx.stroke();
            // });
        }

        window.addEventListener('resize', resize);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            let currentN = n !== null ? n : STRATA;
            if (e.deltaY < 0) {
                n = currentN + 1;
            } else {
                n = Math.max(1, currentN - 1);
            }
            const newParams = new URLSearchParams(window.location.search);
            newParams.set('n', n);
            window.location.search = newParams.toString();
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            let i = Math.round(n / COLORS.length);
            if (e.button === 0) i++;
            else if (e.button === 2) i = Math.max(1, i - 1);
            n = i * COLORS.length;
            const params = new URLSearchParams(window.location.search);
            params.set('n', n);
            window.location.search = params.toString();
        });

        canvas.addEventListener('contextmenu', e => e.preventDefault());

        resize();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BITU WS Test</title>
</head>

<body>
    <h2>BITU WebSocket Integration Test</h2>
    <button onclick="sendRandomNumber()">Send Random Number</button>
    <p id="status">Status: Connecting...</p>
    <p id="response">Response: -</p>

    <script>
        const ws = new WebSocket("ws://127.0.0.1:9999/ttt_ws");
        const statusEl = document.getElementById("status");
        const responseEl = document.getElementById("response");

        ws.onopen = () => {
            statusEl.textContent = "Status: Connected to 127.0.0.1:9999";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.result !== undefined) {
                responseEl.textContent = `Response: Server returned ${data.result}`;
            }
            if (data.server_push !== undefined) {
                console.log("Unsolicited server message:", data.server_push);
            }
        };

        ws.onclose = () => {
            statusEl.textContent = "Status: Disconnected";
        };

        ws.onerror = (error) => {
            console.error("WebSocket Error:", error);
        };

        function sendRandomNumber() {
            if (ws.readyState === WebSocket.OPEN) {
                const randomInt = Math.floor(Math.random() * 100);
                console.log("Sending number:", randomInt);
                ws.send(JSON.stringify({ number: randomInt }));
            } else {
                alert("WebSocket is not connected.");
            }
        }
    </script>
</body>

</html>

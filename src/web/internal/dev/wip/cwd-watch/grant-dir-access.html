<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Directory File Editor</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  input, textarea { width: 100%; margin: 5px 0; }
  textarea { height: 300px; }
</style>
</head>
<body>

<button id="chooseDir">Choose Directory</button>
<br>
<input type="text" id="fileName" placeholder="Enter filename">
<textarea id="fileContent" placeholder="File content..."></textarea>

<script>
let dirHandle = null;
const fileNameInput = document.getElementById('fileName');
const fileContentInput = document.getElementById('fileContent');
const chooseDirBtn = document.getElementById('chooseDir');

chooseDirBtn.addEventListener('click', async () => {
    dirHandle = await window.showDirectoryPicker();
    alert('Directory access granted.');
});

fileNameInput.addEventListener('input', async () => {
    if (!dirHandle) return;
    const name = fileNameInput.value.trim();
    if (!name) return;

    try {
        const fileHandle = await dirHandle.getFileHandle(name, { create: true });
        const file = await fileHandle.getFile();
        const content = await file.text();
        fileContentInput.value = content;
    } catch (e) {
        console.error(e);
    }
});

fileContentInput.addEventListener('input', async () => {
    if (!dirHandle) return;
    const name = fileNameInput.value.trim();
    if (!name) return;

    try {
        const fileHandle = await dirHandle.getFileHandle(name, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(fileContentInput.value);
        await writable.close();
    } catch (e) {
        console.error(e);
    }
});
</script>

</body>
</html>

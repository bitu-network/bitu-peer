<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Live CWD Monitor</title>
</head>

<body>
    📄 Files: <span id="files">0</span><br>
    📁 Folders: <span id="folders">0</span>


    <script>
        const ws = new WebSocket(`ws://localhost:${LOCAL_WS_PORT}`);
        ws.onmessage = e => {
            const d = JSON.parse(e.data);
            files.textContent = d.files;
            folders.textContent = d.folders;
        };
    </script>

</body>

</html>

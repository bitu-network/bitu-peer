<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>TTT Spatial Stream Globe</title>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.136.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html,
        body,
        #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #050505;
            font-family: monospace;
        }

        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(10, 10, 15, 0.85);
            color: #00ffcc;
            padding: 14px 18px;
            border: 1px solid #00ffcc;
            z-index: 10;
            font-size: 13px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            pointer-events: none;
        }

        #ui-overlay .title {
            font-weight: bold;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div id="ui-overlay">
        <div class="title">TTT SPATIAL STREAM (HTTP)</div>
        <div id="status" style="color: #ffaa00;">Loading...</div>
        <div id="height-display" style="margin-top: 4px;">Height: 0 m</div>
        <div id="globe-zoom-display" style="margin-top: 4px;">Sphere Zoom: 0</div>
        <div id="r-hop-display" style="margin-top: 4px;">r_hop: 0</div>
        <div id="point-count" style="margin-top: 4px;">Points Rendered: 0</div>
        <div id="bounds-display" style="margin-top: 4px;">Bounds: N: 0, S: 0, E: 0, W: 0</div>
    </div>

    <div id="cesiumContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/cesium@1.136.0/Build/Cesium/Cesium.js"></script>
    <script type="module" src="index.js"></script>
</body>

</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>GeoNames 15000+ Globe View</title>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.136.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.136.0/Build/Cesium/Cesium.js"></script>
    <script type="module" src="/assets/components.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #050505;
            font-family: monospace;
        }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(10, 10, 15, 0.85);
            color: #00ffcc;
            padding: 14px 18px;
            border: 1px solid #00ffcc;
            z-index: 10;
            font-size: 13px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            pointer-events: none;
        }
        #ui-overlay .title { font-weight: bold; margin-bottom: 6px; letter-spacing: 1px; }
        #tooltip {
            position: absolute;
            display: none;
            background: rgba(10, 10, 15, 0.9);
            color: #00ffcc;
            padding: 8px 12px;
            border: 1px solid #00ffcc;
            font-size: 12px;
            z-index: 20;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <div class="title">GEONAMES CITIES (15,000+)</div>
        <div id="status" style="color: #ffaa00;">Loading dataset...</div>
        <div id="point-count" style="margin-top: 4px;">Points Rendered: 0</div>
    </div>
    <div id="tooltip"></div>
    <globe-view></globe-view>
    <script type="module" src="index.js"></script>
</body>
</html>

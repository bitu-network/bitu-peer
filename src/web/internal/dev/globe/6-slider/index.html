<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Voronoi Depth Renderer (TTT Database)</title>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.136.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html,
        body,
        #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #050505;
            font-family: monospace;
        }

        #ui {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            background: rgba(10, 10, 15, 0.85);
            color: #fff;
            padding: 14px 18px;
            border-radius: 6px;
            border: 1px solid #fff;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
    </style>
</head>

<body>

    <div id="ui">
        <div style="font-weight: bold; margin-bottom: 8px; letter-spacing: 1px;">TTT VORONOI DEPTH TESTER</div>
        <div id="status" style="font-size: 11px; margin-bottom: 8px; color: #ffaa00;">Loading...</div>
        <label for="depth">Layer Depth (r_hop): <span id="depthVal">2</span></label><br>
        <input type="range" id="depth" min="0" max="20" value="2" style="width: 140px; margin-top: 6px;"><br>
        <div id="count" style="font-size: 11px; margin-top: 8px;">Points: 0</div>
    </div>

    <div id="cesiumContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/cesium@1.136.0/Build/Cesium/Cesium.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-geo-voronoi@2"></script>

    <script type="module" src="index.js"></script>


</body>

</html>
